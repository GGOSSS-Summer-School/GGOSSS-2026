[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtools"
version = "0.1.0"
description = "CROCO tools: data download, CROCO preprocessing, plotting, validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # pinned in ggosss2026_conda_env.yaml; install with: pip install --no-deps -e .

[project.scripts]
ggosss26 = "gtools.ggosss26:main"

[tool.setuptools.packages.find]
include = ["gtools*"]
